<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Create a Dark Matter Dining account to manage your restaurant reservations and preferences." />
  <meta name="keywords" content="Dark Matter Dining, register, account, sign up" />
  <meta name="author" content="Cameron Evans - 103564648" />
  <link rel="stylesheet" href="css/style.css" />
  <script src="js/jquery.min.js"></script>
  <script src="js/script.js"></script>
  <title>Dark Matter Dining - Register</title>
</head>

<body>

<header>
  <h1><img class="brand-logo" src="images/logo.png" width="1254" height="1254" alt="" aria-hidden="true" /><span>Dark Matter Dining</span></h1>
  <nav class="top_nav" aria-label="Main navigation">
    <a href="index.html"><span>Home</span></a>
    <a href="restaurants.html"><span>Restaurants</span></a>
    <a href="recommend.html"><span>Recommendations</span></a>
    <a href="reservation.html"><span>Reservation</span></a>
    <a class="active" href="register.html"><span>Register</span></a>
    <a href="bill.html"><span>Calculator</span></a>
  </nav>
</header>

<main class="register">

  <form class="register-form" id="regform" novalidate>
    <h2>Create an Account</h2>

    <!-- Top row: account details (left) + gender & dietary (right) -->
    <div class="reg-top">

      <fieldset class="reg-details">
        <legend>Account Details</legend>

        <label for="uname">
          Username
          <input type="text" id="uname" name="uname" autocomplete="username" />
          <span class="error-msg" id="err-username" role="alert"></span>
        </label>

        <label for="email">
          Email Address
          <input type="email" id="email" name="email" autocomplete="email" />
          <span class="error-msg" id="err-email" role="alert"></span>
        </label>

        <label for="reg-phone">
          Phone Number
          <input type="tel" id="reg-phone" name="phone" autocomplete="tel" />
          <span class="error-msg" id="err-phone" role="alert"></span>
        </label>

        <label for="reg-country">
          Country / Region
          <select id="reg-country" name="country">
            <option value="">Select...</option>
            <option value="AU">Australia</option>
            <option value="NZ">New Zealand</option>
            <option value="US">United States</option>
            <option value="UK">United Kingdom</option>
            <option value="JP">Japan</option>
            <option value="CN">China</option>
            <option value="IN">India</option>
            <option value="SG">Singapore</option>
            <option value="other">Other</option>
          </select>
          <span class="error-msg" id="err-country" role="alert"></span>
        </label>

        <label for="pwd1">
          Password
          <input type="password" id="pwd1" name="pwd1" autocomplete="new-password" />
          <span class="error-msg" id="err-password" role="alert"></span>
        </label>

        <label for="pwd2">
          Confirm Password
          <input type="password" id="pwd2" name="pwd2" autocomplete="new-password" />
          <span class="error-msg" id="err-confirm" role="alert"></span>
        </label>

      </fieldset>

      <!-- Right column: gender + dietary -->
      <div class="reg-right">

        <fieldset class="reg-gender">
          <legend>Gender</legend>
          <label><input type="radio" id="genm" name="gender" value="male" /> Male</label>
          <label><input type="radio" id="genf" name="gender" value="female" /> Female</label>
          <label><input type="radio" id="geno" name="gender" value="other" /> Other</label>
          <span class="error-msg" id="err-gender" role="alert" style="display:block;width:100%;"></span>
        </fieldset>

        <fieldset class="reg-dietary">
          <legend>Dietary Preferences</legend>
          <label><input type="checkbox" name="dietary" value="vegetarian" /> Vegetarian</label>
          <label><input type="checkbox" name="dietary" value="vegan" /> Vegan</label>
          <label><input type="checkbox" name="dietary" value="halal" /> Halal</label>
          <label><input type="checkbox" name="dietary" value="gluten-free" /> Gluten-Free</label>
          <label><input type="checkbox" name="dietary" value="dairy-free" /> Dairy-Free</label>
          <label><input type="checkbox" name="dietary" value="none" id="dietary-none" /> No preference</label>
          <span class="error-msg" id="err-dietary" role="alert" style="display:block;width:100%;"></span>
        </fieldset>

      </div>
    </div>

    <!-- Submit -->
    <div class="reg-submit">
      <button type="submit">Create Account</button>
    </div>

  </form>

</main>

<footer>
  <p>&copy; 2026 Cameron Evans - Dark Matter Dining.</p>
</footer>

</body>
</html>
